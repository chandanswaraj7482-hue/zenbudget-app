<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payment Successful - ZenBudget</title>
  <style>
    * { box-sizing: border-box; }
    body {
      background-color: #09090f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.15);
      border: 2px solid #10b981;
      color: #10b981;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 10px 0;
      color: #ffffff;
    }
    p {
      color: #94a3b8;
      font-size: 0.95rem;
      max-width: 320px;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      padding: 14px 28px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3);
      cursor: pointer;
      border: none;
    }
  </style>
</head>
<body>
  <div class="icon">✓</div>
  <h1>Payment Completed!</h1>
  <p>Your ZenBudget Premium subscription has been activated. You can now return to the app.</p>
  <button class="btn" onclick="window.close()">Return to ZenBudget App</button>
</body>
</html>
