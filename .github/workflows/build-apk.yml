name: Build & Release Android APK

on:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build

      - name: Setup Java 17
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Android Assets
        run: npx cap sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Update APK in public directory
        run: |
          mkdir -p public
          cp android/app/build/outputs/apk/debug/app-debug.apk public/zenbudget.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk zenbudget.apk
          git config --global user.name "ZenBudget Auto Builder"
          git config --global user.email "builder@zenbudget.app"
          git add public/zenbudget.apk zenbudget.apk
          git commit -m "chore: auto-build updated Android APK [skip ci]" || echo "No changes to commit"
          git push
